# Zaxira: agar Tarjimon.xcodeproj ochilmasa, Mac'da `brew install xcodegen && xcodegen` buyrug'i
# shu fayldan loyihani qayta yaratadi.
name: Tarjimon
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    BUNDLE_PREFIX: uz.tarjimon.q7k2m
    APP_GROUP: group.$(BUNDLE_PREFIX)
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_CFBundleDisplayName: Tarjimon
targets:
  Tarjimon:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: TarjimonKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Tarjimon.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  TarjimonKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
